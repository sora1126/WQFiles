name: WQJITHelper
options:
  bundleIdPrefix: cz.kolbi.wqfiles
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  WQJITHelper:
    type: app-extension
    platform: iOS
    sources:
      - path: Helper.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.kolbi.wqfiles.JITHelper
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../Frameworks"
    dependencies:
      - framework: Frameworks/StikJIT.framework
        embed: false
